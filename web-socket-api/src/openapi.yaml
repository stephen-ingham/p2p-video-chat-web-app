openapi: 3.0.3
info:
  title: Voneo Signalling API
  description: >
    Signalling API for the Voneo peer-to-peer video chat app. Handles
    authentication and call lifecycle (create/join/leave); actual media
    is exchanged peer-to-peer over WebRTC once signalling completes. Each
    call gets its own in-memory WebSocket server for SDP offer relay, chat,
    and participant notifications — see the WebSocket protocol note at the
    bottom of this document.
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: Local dev

paths:
  /auth/signup:
    post:
      summary: Register a new user
      operationId: signupUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'

  /auth/login:
    post:
      summary: Log in with email and password
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: >
            Login succeeded. An access token is returned in the response
            body and a refresh token is set as an HttpOnly cookie
            (`refresh_token`, scoped to `/auth`).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                        format: jwt
        '400':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'

  /auth/logout:
    post:
      summary: Log out and revoke the current refresh token
      operationId: logoutUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logged out successfully. Clears the `refresh_token` cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'

  /auth/refresh:
    post:
      summary: Exchange a valid refresh token cookie for a new access token
      operationId: refreshToken
      security:
        - bearerAuth: []
      responses:
        '200':
          description: New access token issued; refresh token is rotated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      accessToken:
                        type: string
                        format: jwt
        '401':
          description: No, invalid, expired, or revoked refresh token
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'

  /call/ice-servers:
    get:
      summary: Get the STUN/TURN servers to use for WebRTC peer connections
      description: >
        Returns an `RTCPeerConnection` `iceServers` list. When the API has
        `TURN_URLS` and `TURN_SECRET` configured, this is the self-hosted
        coturn server's STUN and TURN URLs, with TURN credentials minted for
        the requesting user that expire after 12 hours (coturn TURN REST API
        scheme). Otherwise it's Google's public STUN servers only, with no
        TURN relay.
      operationId: getIceServers
      security:
        - bearerAuth: []
      responses:
        '200':
          description: ICE server configuration
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      iceServers:
                        type: array
                        items:
                          type: object
                          required: [urls]
                          properties:
                            urls:
                              type: array
                              items:
                                type: string
                              example: ['turn:203.0.113.10:3478?transport=udp']
                            username:
                              type: string
                              description: TURN only — `<expiry unix secs>:<email>`
                            credential:
                              type: string
                              description: TURN only — base64 HMAC-SHA1 of `username`
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'

  /call/create:
    post:
      summary: Create a new call
      description: >
        Spins up a dedicated in-memory WebSocket server for the call and
        registers the requesting user as its first participant.
      operationId: createCall
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Call created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      callID:
                        type: string
                        format: uuid
                      callURL:
                        type: string
                        description: WebSocket URL for the call's signalling server
        '500':
          description: Server error during call/WebSocket server creation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'

  /call/{callID}/join:
    put:
      summary: Join an existing call
      operationId: joinCall
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/callID'
      responses:
        '201':
          description: Joined successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      callURL:
                        type: string
                        description: WebSocket URL for the call's signalling server
        '400':
          description: Invalid call ID, or call has already ended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '404':
          description: Call ID not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'

  /call/{callID}/leave:
    delete:
      summary: Leave an active call
      description: >
        Removes the requesting user as a participant. If they are the last
        active participant, the call is marked finished and its WebSocket
        server is shut down.
      operationId: leaveCall
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/callID'
      responses:
        '200':
          description: Left the call successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '400':
          description: Invalid call ID, or call is not active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '403':
          description: Call has finished or requesting user is not an active participant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '404':
          description: Call ID not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'

  /call/{callID}/messages:
    post:
      summary: Send a chat message on a call
      description: >
        **Not yet implemented** — the route is registered and auth-gated
        but the handler currently returns no response. Do not rely on
        this endpoint; use the WebSocket `chatMessage` event instead (see
        the note below).
      operationId: sendMessage
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/callID'
      responses:
        '501':
          description: Not implemented

components:
  parameters:
    callID:
      name: callID
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    SignUpRequest:
      type: object
      required: [username, email, password]
      properties:
        username:
          type: string
          minLength: 3
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 6

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    User:
      type: object
      description: Primary key is `email`; there is no separate numeric ID.
      properties:
        username:
          type: string
        email:
          type: string
          format: email

    SuccessMessage:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            message:
              type: string

    ErrorMessage:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            error:
              type: string

    ValidationError:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            message:
              type: string
            details:
              type: array
              items:
                type: object

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Access token, either as an `Authorization: Bearer <token>` header
        or an `access_token` cookie. `/auth/logout` and `/auth/refresh`
        additionally require the `refresh_token` HttpOnly cookie set at
        login.

# WebSocket protocol (per-call server, not covered by the schema above):
# Each call gets a dedicated WebSocket server at the URL returned from
# /call/create or /call/{callID}/join.
#
# Client -> server messages:
#   - newParticipantOnCall
#   - chatMessage
#   - offer (relayed to a named recipient for WebRTC SDP exchange)
#
# Server -> client messages:
#   - receivedNewParticipantNotif
#   - responseCurrentCallParticipants
#   - offer
#   - chatMessage / receivedNewChatMessage
