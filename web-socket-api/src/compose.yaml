name: voneo-signalling-api

services:

  signalling-server-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: signalling-server-dev:1.0.0
    ports:
      - 3000:3000
    develop:
      watch:
        - action: sync
          path: .
          target: /app
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET}
      - NODE_ENV=${NODE_ENV}
      - LOCAL=${LOCAL}
      - DB_NAME=${DB_NAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - NGROK_HOST=${NGROK_HOST}
      - TURN_URLS=${TURN_URLS:-}
      - TURN_SECRET=${TURN_SECRET:-}
    depends_on:
      mysql-db:
        condition: service_healthy

  signalling-server-prod:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: europe-west2-docker.pkg.dev/signalling-api/voneo/voneo-backend:1.0.0
    ports:
      - 3000:3000
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET}
      - NODE_ENV=${NODE_ENV}
      - DB_NAME=${DB_NAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - ALLOWED_ORIGIN=${ALLOWED_ORIGIN}
      - TURN_URLS=${TURN_URLS:-}
      - TURN_SECRET=${TURN_SECRET:-}

  mysql-db:
      image: mysql:8.4
      container_name: local-mysql
      restart: always
      environment:
        MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
        MYSQL_DATABASE: ${DB_NAME}
      ports:
        - "${DB_PORT:-3306}:3306"
      healthcheck:
        # Over TCP (127.0.0.1), which is how the API connects. `-h localhost`
        # uses the Unix socket, and on first start MySQL's entrypoint runs a
        # temporary server with networking off: a socket ping passes then,
        # marking MySQL healthy (starting the API) while TCP is still refused.
        test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -P 3306 -p${DB_PASSWORD}"]
        interval: 10s
        timeout: 5s
        retries: 5
        # First-time initialisation takes ~1.5 min on Docker Desktop. Failed
        # checks during it don't count towards `retries`, and it checks
        # every 3s meanwhile so dependants start soon after MySQL is ready.
        start_period: 180s
        start_interval: 3s