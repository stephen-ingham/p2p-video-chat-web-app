name: Mobile CI

# Fast checks for mobile-app/ — a Capacitor native Android shell around the
# existing web frontend, not a separate app implementation (see the "Voneo
# Android App" tracking artifact). No RN component tests here: the app's
# own logic is the same Astro/React code already covered by
# web-server/tests/. Path-filtered so this doesn't run until mobile-app/
# exists.

on:
  pull_request:
    paths:
      - "mobile-app/**"
  push:
    branches: [dev, main]
    paths:
      - "mobile-app/**"
  workflow_dispatch:

jobs:
  lint:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci --prefix mobile-app
      - name: Lint (xo + prettier)
        run: npm run lint --prefix mobile-app

  android-build:
    needs: lint
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci --prefix mobile-app

      - name: Sync Capacitor native project
        run: npx cap sync android
        working-directory: mobile-app

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Compiles the native wrapper (including the WebChromeClient
      # permission-bridge glue) without needing an emulator — the fast
      # signal that the Android side isn't broken. Real behaviour (does the
      # permission prompt actually work) is only checked by mobile-e2e.yml.
      - name: Build debug APK
        run: ./gradlew assembleDebug
        working-directory: mobile-app/android
