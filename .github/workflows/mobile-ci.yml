name: Mobile CI

# Fast checks for the mobile-app/ Expo/React Native project. Path-filtered
# so it doesn't run until mobile-app/ exists — see the "Voneo Android App"
# tracking artifact for the scaffolding plan this assumes (Jest,
# @testing-library/react-native, XO/Prettier reused from the repo root).

on:
  pull_request:
    paths:
      - "mobile-app/**"
      # Shared palette, read by the app (src/theme/theme.ts)
      - "colors.json"
  push:
    branches: [dev, main]
    paths:
      - "mobile-app/**"
      # Shared palette, read by the app (src/theme/theme.ts)
      - "colors.json"
  workflow_dispatch:

jobs:
  lint:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      # xo/prettier (and globals, imported by xo.config.mjs) are root
      # devDependencies, reused rather than duplicated in mobile-app/ —
      # `npm run lint --prefix mobile-app` finds them via the root's
      # node_modules/.bin, so both installs are needed.
      - name: Install root dependencies (xo, prettier)
        run: npm ci
      - name: Install dependencies
        run: npm ci --prefix mobile-app
      - name: Lint (xo + prettier)
        run: npm run lint --prefix mobile-app

  unit-and-component-tests:
    needs: lint
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci --prefix mobile-app
      - name: Jest unit + @testing-library/react-native component tests
        run: npm test --prefix mobile-app
