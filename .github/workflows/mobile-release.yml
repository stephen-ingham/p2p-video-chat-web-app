name: Mobile Release (Fastlane → Play Console)

# Builds a signed release build and uploads it to the Play Console internal
# testing track via Fastlane. Mirrors the web app's deploy-on-merge
# pattern, but for mobile-app/ and gated on main (not dev) since store
# submissions aren't cheap to undo.
#
# Requires (not yet configured):
#   - Android release signing keystore as repo secrets:
#     ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
#     ANDROID_KEY_PASSWORD
#   - A Play Console service account JSON as a repo secret
#     (PLAY_CONSOLE_SERVICE_ACCOUNT_JSON) for Fastlane's `supply` action
#   - mobile-app/android/fastlane/Fastfile with an `internal` lane that
#     builds the release AAB and calls `supply` against that track

on:
  push:
    branches: [main]
    paths:
      - "mobile-app/**"
  workflow_dispatch:

jobs:
  build-and-release:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci --prefix mobile-app

      - name: Sync Capacitor native project
        run: npx cap sync android
        working-directory: mobile-app

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: mobile-app/android

      - name: Decode release keystore
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/release.keystore
        working-directory: mobile-app/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Fastlane — build + upload to Play Console internal track
        run: bundle exec fastlane internal
        working-directory: mobile-app/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_CONSOLE_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_CONSOLE_SERVICE_ACCOUNT_JSON }}
