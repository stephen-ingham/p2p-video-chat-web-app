name: Mobile E2E (Maestro)

# Every Maestro flow against a local dev API, on manual dispatch only
# (Actions tab, or `gh workflow run mobile-e2e.yml`). The PR checks run against GCP instead: pr-dev.yml's
# e2e-gcp-dev runs the happy-path flow against the dev stack, and
# pr-main.yml's e2e-gcp-prod-preview runs every flow against prod-preview.
#
# The APK build and emulator run are in .github/actions/maestro-e2e (shared
# with those GCP checks). Here the app talks to a local dev API at
# http://10.0.2.2:3000 (the emulator's alias for the runner), started from
# the same compose service as `npm run dev`, with LOCAL=true and
# NODE_ENV=dev so the seeded test users the flows log in as exist.

on:
  workflow_dispatch:

jobs:
  e2e:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Start the dev signalling API (LOCAL=true)
        run: |
          cp .env.example .env
          sed -i -e 's/^LOCAL=.*/LOCAL=true/' -e 's/^NGROK_HOST=.*/NGROK_HOST=/' .env
          docker compose --env-file .env -f web-socket-api/src/compose.yaml up -d --build signalling-server-dev
          for _ in $(seq 1 60); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/call/ice-servers)" = "401" ] && exit 0
            sleep 5
          done
          docker compose --env-file .env -f web-socket-api/src/compose.yaml logs
          exit 1

      - name: Build the APK and run the Maestro flows
        uses: ./.github/actions/maestro-e2e
        with:
          api_url: http://10.0.2.2:3000
