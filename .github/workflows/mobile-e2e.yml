name: Mobile E2E (Maestro)

# Heavier e2e check for mobile-app/, split like this repo's Playwright e2e:
# PRs into dev run only the happy-path flow (tagged `happy-path`), via
# pr-dev.yml's mobile-e2e-happy-path job calling this workflow with
# happy_path_only, on every PR. PRs into main run every flow, but only when
# they touch the app, the API it talks to, or this workflow. The scheduled
# and manual runs also run every flow.
#
# The APK build and emulator run are in .github/actions/maestro-e2e (shared
# with pr-dev.yml's run against the GCP dev stack). Here the app talks to a
# local dev API at http://10.0.2.2:3000 (the emulator's alias for the
# runner), started from the same compose service as `npm run dev`, with
# LOCAL=true and NODE_ENV=dev so the seeded test users the flows log in as
# exist.

on:
  # PRs into dev call this from pr-dev.yml instead.
  workflow_call:
    inputs:
      happy_path_only:
        description: Run only the flows tagged happy-path
        type: boolean
        default: false
  pull_request:
    branches: [main]
    paths:
      - "mobile-app/**"
      # Shared palette, read by the app (src/theme/theme.ts)
      - "colors.json"
      # The signalling API the flows log in and create calls against
      - "web-socket-api/**"
      - ".github/workflows/mobile-e2e.yml"
  schedule:
    - cron: "0 6 * * 1-5" # weekdays, 06:00 UTC
  workflow_dispatch:

jobs:
  e2e:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Start the dev signalling API (LOCAL=true)
        run: |
          cp .env.example .env
          sed -i -e 's/^LOCAL=.*/LOCAL=true/' -e 's/^NGROK_HOST=.*/NGROK_HOST=/' .env
          docker compose --env-file .env -f web-socket-api/src/compose.yaml up -d --build signalling-server-dev
          for _ in $(seq 1 60); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/call/ice-servers)" = "401" ] && exit 0
            sleep 5
          done
          docker compose --env-file .env -f web-socket-api/src/compose.yaml logs
          exit 1

      - name: Build the APK and run the Maestro flows
        uses: ./.github/actions/maestro-e2e
        with:
          api_url: http://10.0.2.2:3000
          # Happy path only when called with happy_path_only (PRs into dev);
          # every flow otherwise.
          happy_path_only: ${{ inputs.happy_path_only == true }}
