name: Mobile E2E (Maestro)

# Every Maestro flow against a local dev API, on manual dispatch only
# (Actions tab, or `gh workflow run mobile-e2e.yml`). The PR checks run against GCP instead: pr-dev.yml's
# e2e-gcp-dev runs the happy-path flow against the dev stack, and
# pr-main.yml's e2e-gcp-prod-preview runs every flow against prod-preview.
#
# The APK build and emulator run are in .github/actions/maestro-e2e (shared
# with those GCP checks). Here the app talks to a local dev API at
# http://10.0.2.2:3000 (the emulator's alias for the runner), started from
# the same compose service as `npm run dev`, with LOCAL=true and
# NODE_ENV=dev so the seeded test users the flows log in as exist.
#
# Or set the api_url input to a deployed stack's appUrl (e.g. prod's) to run
# against that instead: no local API, and the user the flows log in as is
# signed up first, since deployed stacks run with NODE_ENV=production.

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: A deployed stack's appUrl to run against. Leave empty for a local dev API on the runner
        default: ""

jobs:
  e2e:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Start the dev signalling API (LOCAL=true)
        if: inputs.api_url == ''
        run: |
          cp .env.example .env
          sed -i -e 's/^LOCAL=.*/LOCAL=true/' -e 's/^NGROK_HOST=.*/NGROK_HOST=/' .env
          docker compose --env-file .env -f web-socket-api/src/compose.yaml up -d --build signalling-server-dev
          for _ in $(seq 1 60); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/call/ice-servers)" = "401" ] && exit 0
            sleep 5
          done
          docker compose --env-file .env -f web-socket-api/src/compose.yaml logs
          exit 1

      # As in pr-dev.yml/pr-main.yml's GCP jobs. Signing up fails harmlessly
      # if the user exists; the login check must pass.
      - name: Check the stack and sign up the flows' user
        if: inputs.api_url != ''
        env:
          APP_URL: ${{ inputs.api_url }}
        run: |
          APP_URL=${APP_URL%/}
          until [ "$(curl -s -o /dev/null -w '%{http_code}' "$APP_URL/call/ice-servers")" = "401" ]; do
            echo "Waiting for $APP_URL to serve the API"
            sleep 15
          done
          curl -s -o /dev/null -X POST "$APP_URL/auth/signup" -H 'Content-Type: application/json' \
            -d '{"username":"john2739","email":"john.smith@gmail.com","password":"ExamplePassword123"}'
          curl -fsS -o /dev/null -X POST "$APP_URL/auth/login" -H 'Content-Type: application/json' \
            -d '{"email":"john.smith@gmail.com","password":"ExamplePassword123"}'

      - name: Build the APK and run the Maestro flows
        uses: ./.github/actions/maestro-e2e
        with:
          api_url: ${{ inputs.api_url || 'http://10.0.2.2:3000' }}
