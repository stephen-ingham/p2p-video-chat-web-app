name: Mobile E2E (Maestro)

# Heavier e2e check for mobile-app/, deliberately kept out of the fast PR
# path (same split as this repo's Playwright e2e vs. lint/unit tests):
# runs on a schedule and on manual dispatch rather than on every push,
# since it needs a Gradle-built APK + Android emulator.
#
# Kept deliberately small in scope: this smoke-tests the native wrapper
# itself (does the WebView load, does the camera/mic permission prompt
# grant, one golden-path click-through) — not app UI/behaviour, which is
# the same Astro/React code already covered by e2e/*.spec.ts (Playwright)
# and web-server/tests/ (Vitest).
#
# Requires (not yet configured):
#   - mobile-app/android/ Gradle project (via `npx cap add android`)
#   - The WebChromeClient.onPermissionRequest native glue in that project
#   - Maestro flow files under mobile-app/.maestro/

on:
  schedule:
    - cron: "0 6 * * 1-5" # weekdays, 06:00 UTC
  workflow_dispatch:

jobs:
  e2e:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci --prefix mobile-app

      - name: Sync Capacitor native project
        run: npx cap sync android
        working-directory: mobile-app

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build debug APK
        run: ./gradlew assembleDebug
        working-directory: mobile-app/android

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install APK and run Maestro flows on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          script: |
            adb install mobile-app/android/app/build/outputs/apk/debug/app-debug.apk
            curl -Ls "https://get.maestro.mobile.dev" | bash
            export PATH="$PATH:$HOME/.maestro/bin"
            maestro test mobile-app/.maestro/
