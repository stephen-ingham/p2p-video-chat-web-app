name: Deploy (prod)

# Runs after a PR merges into main (i.e. a push to main). Requires the
# prod GitHub environment's GCP_WORKLOAD_IDENTITY_PROVIDER and
# GCP_DEPLOY_SERVICE_ACCOUNT secrets (set up, see infra/README.md step 2),
# plus PULUMI_ACCESS_TOKEN and the prod Pulumi stack (not yet created).
# Until those exist this workflow fails at the Pulumi step by design,
# rather than silently no-op.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for GCP Workload Identity Federation

jobs:
  deploy:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # TODO: create the WIF pool/provider + service account in GCP, then
      # set these as repo/environment secrets or vars. Consider requiring
      # manual approval on the "prod" GitHub Environment before this runs.
      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Install infra dependencies
        run: npm ci
        working-directory: infra

      # TODO: set PULUMI_ACCESS_TOKEN as a repo secret once a Pulumi Cloud
      # (or self-managed) backend is chosen.
      - name: Pulumi up (prod stack)
        uses: pulumi/actions@v6
        with:
          command: up
          stack-name: prod
          work-dir: infra
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
