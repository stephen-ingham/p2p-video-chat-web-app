name: Deploy (prod)

# Runs after a PR merges into main (i.e. a push to main). Uses the prod
# GitHub environment's GCP_WORKLOAD_IDENTITY_PROVIDER,
# GCP_DEPLOY_SERVICE_ACCOUNT and PULUMI_ACCESS_TOKEN secrets and the prod
# Pulumi stack (infra/README.md one-time setup).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for GCP Workload Identity Federation

jobs:
  deploy:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    # The URL shows in the repo's Deployments sidebar, linking the latest
    # prod deploy's frontend.
    environment:
      name: prod
      url: ${{ steps.pulumi.outputs.appUrl }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # TODO: consider requiring manual approval on the "prod" GitHub
      # Environment before this runs.
      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Install infra dependencies
        run: npm ci
        working-directory: infra

      # Stack outputs become step outputs (appUrl, used above).
      - name: Pulumi up (prod stack)
        id: pulumi
        uses: pulumi/actions@v6
        with:
          command: up
          stack-name: prod
          work-dir: infra
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
