name: PR checks (main)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Which test jobs this PR needs, from the files it changes. The jobs below
  # are skipped (not path-filtered at workflow level) when nothing they cover
  # changed, since a skipped job still satisfies a required status check.
  # Manual runs run everything.
  changes:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      api: ${{ github.event_name != 'pull_request' || steps.filter.outputs.api == 'true' }}
      web_e2e: ${{ github.event_name != 'pull_request' || steps.filter.outputs.web_e2e == 'true' }}
      nat: ${{ github.event_name != 'pull_request' || steps.filter.outputs.nat == 'true' }}
      gcp: ${{ github.event_name != 'pull_request' || steps.filter.outputs.gcp == 'true' }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            shared: &shared
              - "package.json"
              - "package-lock.json"
              - ".env.example"
              - ".github/workflows/pr-main.yml"
            api:
              - *shared
              - "web-socket-api/**"
            web_e2e: &web_e2e
              - *shared
              - "web-server/**"
              - "web-socket-api/**"
              - "e2e/**"
              - "playwright.config.ts"
              - "colors.json"
              - "scripts/dispatch.mjs"
              - "scripts/test-e2e*"
            nat:
              - *web_e2e
              - "infra/coturn/**"
            gcp:
              - *web_e2e
              - "infra/**"
              - "scripts/gcp-e2e.mjs"

  lint:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      # XO type-checks the TypeScript in these workspaces, so it needs their
      # deps (web-server/src's tsconfig also extends astro/tsconfigs/strict)
      # and Astro's generated types (astro:middleware, import.meta.env).
      # mobile-app/ is skipped here, linted by mobile-ci.yml instead.
      - name: Install workspace dependencies for type-aware lint
        run: |
          npm ci --prefix web-server/src
          npm ci --prefix web-server/tests
          npm ci --prefix infra
      - name: Generate Astro types
        run: npx astro sync
        working-directory: web-server/src
      - name: Lint (xo + prettier)
        run: npm run lint

  api-tests:
    needs: [lint, changes]
    if: needs.changes.outputs.api == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Create .env from example
        run: cp .env.example .env
      - name: web-socket-api integration + unit tests
        run: npm run test:it

  component-tests:
    needs: lint
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: web-server component tests
        run: npm run test:component

  infra-tests:
    needs: lint
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install infra dependencies
        run: npm ci
        working-directory: infra
      - name: Pulumi resource snapshot tests
        run: npm test
        working-directory: infra

  # !failure() rather than the default success(), so a skipped api-tests
  # (frontend-only PR) doesn't skip the e2e jobs with it.
  e2e-full-suite:
    needs: [changes, api-tests, component-tests]
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.web_e2e == 'true' }}
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Create .env from example
        run: cp .env.example .env
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Point voneo.test at localhost
        run: echo "127.0.0.1 voneo.test" | sudo tee -a /etc/hosts
      - name: Run full e2e suite
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  # Same-network vs cross-network calls through a self-hosted coturn TURN
  # server — same image + base config as the production VM
  # (infra/turn-server.ts, infra/coturn/turnserver.conf). Browsers run in
  # containers on firewalled, simulated LANs (e2e/compose.nat.yaml), so the
  # runner itself needs no Playwright browsers or voneo.test hosts entry.
  e2e-nat-traversal:
    needs: [changes, api-tests, component-tests]
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.nat == 'true' }}
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Create .env from example
        run: cp .env.example .env
      - name: Run NAT-traversal e2e suite
        run: npm run test:e2e:nat
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-nat-traversal
          path: playwright-report/
          retention-days: 30

  # Full e2e suite against a pre-merge preview of prod: the ephemeral
  # prod-preview stack (prod's settings, TURN VM included, in prod's GCP
  # project; infra/Pulumi.prod-preview.yaml) is deployed, tested and always
  # destroyed. Real prod is untouched until merge. Fork PRs get no GCP
  # credentials, so it only runs for this repo's branches.
  e2e-gcp-prod-preview:
    needs: [changes, api-tests, component-tests]
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.gcp == 'true' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository) }}
    # Every run shares the one prod-preview stack, so one at a time. Never cancel a
    # run in progress: that could skip its teardown.
    concurrency:
      group: gcp-prod-preview-stack
      cancel-in-progress: false
    # Up to ~25 min deploy + tests, with time left for the teardown.
    timeout-minutes: 75
    runs-on: ubuntu-latest
    environment: prod-preview
    permissions:
      contents: read
      id-token: write # GCP Workload Identity Federation
    env:
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
    steps:
      # The PR's head commit rather than the merge commit, so the deployment's
      # git-sha label is a commit that exists on GitHub.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install infra dependencies
        run: npm ci
        working-directory: infra
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      # With no command, this only installs the Pulumi CLI.
      - name: Install Pulumi CLI
        uses: pulumi/actions@v6
      - name: Deploy ephemeral prod-preview stack
        timeout-minutes: 35
        run: node scripts/gcp-e2e.mjs up prod-preview
      - name: Run e2e suite against it
        timeout-minutes: 25
        run: node scripts/gcp-e2e.mjs test prod-preview
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-gcp-prod-preview
          path: playwright-report/
          retention-days: 14
      # Runs even if an earlier step failed or the job was cancelled, so a
      # half-created stack doesn't keep billing.
      - name: Destroy ephemeral prod-preview stack
        if: always()
        timeout-minutes: 20
        run: node scripts/gcp-e2e.mjs down prod-preview
