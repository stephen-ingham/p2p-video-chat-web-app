name: PR checks (main)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      # XO type-checks the TypeScript in these workspaces, so it needs their
      # deps (web-server/src's tsconfig also extends astro/tsconfigs/strict)
      # and Astro's generated types (astro:middleware, import.meta.env).
      # mobile-app/ is skipped here, linted by mobile-ci.yml instead.
      - name: Install workspace dependencies for type-aware lint
        run: |
          npm ci --prefix web-server/src
          npm ci --prefix web-server/tests
          npm ci --prefix infra
      - name: Generate Astro types
        run: npx astro sync
        working-directory: web-server/src
      - name: Lint (xo + prettier)
        run: npm run lint

  api-tests:
    needs: lint
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Create .env from example
        run: cp .env.example .env
      - name: web-socket-api integration + unit tests
        run: npm run test:it
        working-directory: web-socket-api/src

  component-tests:
    needs: lint
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: web-server component tests
        run: npm test
        working-directory: web-server/src

  infra-tests:
    needs: lint
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install infra dependencies
        run: npm ci
        working-directory: infra
      - name: Pulumi resource snapshot tests
        run: npm test
        working-directory: infra

  e2e-full-suite:
    needs: [api-tests, component-tests]
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Create .env from example
        run: cp .env.example .env
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Point voneo.test at localhost
        run: echo "127.0.0.1 voneo.test" | sudo tee -a /etc/hosts
      - name: Run full e2e suite
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  # Same-network vs cross-network calls through a self-hosted coturn TURN
  # server — same image + base config as the production VM
  # (infra/turn-server.ts, infra/coturn/turnserver.conf). Browsers run in
  # containers on firewalled, simulated LANs (e2e/compose.nat.yaml), so the
  # runner itself needs no Playwright browsers or voneo.test hosts entry.
  e2e-nat-traversal:
    needs: [api-tests, component-tests]
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Create .env from example
        run: cp .env.example .env
      - name: Run NAT-traversal e2e suite
        run: npm run test:e2e:nat
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-nat-traversal
          path: playwright-report/
          retention-days: 30

  # Full web e2e suite and every Maestro flow against a pre-merge preview of
  # prod: the ephemeral prod-preview stack (prod's settings, TURN VM
  # included, in prod's GCP project; infra/Pulumi.prod-preview.yaml) is
  # deployed, tested and always destroyed, all in this one job so the
  # concurrency lock covers the stack's whole life. Real prod is untouched
  # until merge. Fork PRs get no GCP credentials, so it only runs for this
  # repo's branches.
  e2e-gcp-prod-preview:
    needs: [api-tests, component-tests]
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    # Every run shares the one prod-preview stack, so one at a time. Never cancel a
    # run in progress: that could skip its teardown.
    concurrency:
      group: gcp-prod-preview-stack
      cancel-in-progress: false
    # Up to ~35 min deploy, ~25 min web tests, ~45 min APK build + emulator
    # run, with time left for the teardown.
    timeout-minutes: 140
    runs-on: ubuntu-latest
    environment: prod-preview
    permissions:
      contents: read
      id-token: write # GCP Workload Identity Federation
    env:
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
    steps:
      # The PR's head commit rather than the merge commit, so the deployment's
      # git-sha label is a commit that exists on GitHub.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install infra dependencies
        run: npm ci
        working-directory: infra
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      # With no command, this only installs the Pulumi CLI.
      - name: Install Pulumi CLI
        uses: pulumi/actions@v6
      - name: Deploy ephemeral prod-preview stack
        timeout-minutes: 35
        run: node scripts/gcp-e2e.mjs up prod-preview
      - name: Run web e2e suite against it
        timeout-minutes: 25
        run: node scripts/gcp-e2e.mjs test prod-preview
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-gcp-prod-preview
          path: playwright-report/
          retention-days: 14
      # The stack runs with NODE_ENV=production, so the dev seed users the
      # Maestro flows log in as don't exist: sign that one up (through the
      # frontend, which proxies the API), then check it can log in.
      - name: Sign up the user the Maestro flows log in as
        id: mobile_user
        timeout-minutes: 20
        working-directory: infra
        run: |
          APP_URL=$(pulumi stack output appUrl --stack prod-preview)
          echo "app_url=$APP_URL" >> "$GITHUB_OUTPUT"
          until [ "$(curl -s -o /dev/null -w '%{http_code}' "$APP_URL/call/ice-servers")" = "401" ]; do
            echo "Waiting for $APP_URL to serve the API"
            sleep 15
          done
          curl -s -o /dev/null -X POST "$APP_URL/auth/signup" -H 'Content-Type: application/json'             -d '{"username":"john2739","email":"john.smith@gmail.com","password":"ExamplePassword123"}'
          curl -fsS -o /dev/null -X POST "$APP_URL/auth/login" -H 'Content-Type: application/json'             -d '{"email":"john.smith@gmail.com","password":"ExamplePassword123"}'
      - name: Run every Maestro flow against it
        timeout-minutes: 45
        uses: ./.github/actions/maestro-e2e
        with:
          api_url: ${{ steps.mobile_user.outputs.app_url }}
          artifact_name: maestro-results-gcp-prod-preview
      # Runs even if an earlier step failed or the job was cancelled, so a
      # half-created stack doesn't keep billing.
      - name: Destroy ephemeral prod-preview stack
        if: always()
        timeout-minutes: 20
        run: node scripts/gcp-e2e.mjs down prod-preview
