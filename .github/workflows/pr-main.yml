name: PR checks (main)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Lint (xo + prettier)
        run: npm run lint

  api-tests:
    needs: lint
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Create .env from example
        run: cp .env.example .env
      - name: web-socket-api integration + unit tests
        run: npm run test:it

  component-tests:
    needs: lint
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: web-server component tests
        run: npm run test:component

  infra-tests:
    needs: lint
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install infra dependencies
        run: npm ci
        working-directory: infra
      - name: Pulumi resource snapshot tests
        run: npm test
        working-directory: infra

  e2e-full-suite:
    needs: [api-tests, component-tests]
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Create .env from example
        run: cp .env.example .env
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Point voneo.test at localhost
        run: echo "127.0.0.1 voneo.test" | sudo tee -a /etc/hosts
      - name: Run full e2e suite
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  # Same-network vs cross-network calls through a self-hosted coturn TURN
  # server — same image + base config as the production VM
  # (infra/turn-server.ts, infra/coturn/turnserver.conf). Browsers run in
  # containers on firewalled, simulated LANs (e2e/compose.nat.yaml), so the
  # runner itself needs no Playwright browsers or voneo.test hosts entry.
  e2e-nat-traversal:
    needs: [api-tests, component-tests]
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Create .env from example
        run: cp .env.example .env
      - name: Run NAT-traversal e2e suite
        run: npm run test:e2e:nat
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-nat-traversal
          path: playwright-report/
          retention-days: 30

  # Full e2e suite against a pre-merge preview of prod: the ephemeral
  # prod-preview stack (prod's settings, TURN VM included, in prod's GCP
  # project; infra/Pulumi.prod-preview.yaml) is deployed, tested and always
  # destroyed. Real prod is untouched until merge. Fork PRs get no GCP
  # credentials, so it only runs for this repo's branches.
  e2e-gcp-prod-preview:
    needs: [api-tests, component-tests]
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    # Every run shares the one prod-preview stack, so one at a time. Never cancel a
    # run in progress: that could skip its teardown.
    concurrency:
      group: gcp-prod-preview-stack
      cancel-in-progress: false
    # Up to ~25 min deploy + tests, with time left for the teardown.
    timeout-minutes: 75
    runs-on: ubuntu-latest
    environment: prod-preview
    permissions:
      contents: read
      id-token: write # GCP Workload Identity Federation
    env:
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
    steps:
      # The PR's head commit rather than the merge commit, so the deployment's
      # git-sha label is a commit that exists on GitHub.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install infra dependencies
        run: npm ci
        working-directory: infra
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      # With no command, this only installs the Pulumi CLI.
      - name: Install Pulumi CLI
        uses: pulumi/actions@v6
      - name: Deploy ephemeral prod-preview stack
        timeout-minutes: 35
        run: node scripts/gcp-e2e.mjs up prod-preview
      - name: Run e2e suite against it
        timeout-minutes: 25
        run: node scripts/gcp-e2e.mjs test prod-preview
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-gcp-prod-preview
          path: playwright-report/
          retention-days: 14
      # Runs even if an earlier step failed or the job was cancelled, so a
      # half-created stack doesn't keep billing.
      - name: Destroy ephemeral prod-preview stack
        if: always()
        timeout-minutes: 20
        run: node scripts/gcp-e2e.mjs down prod-preview
