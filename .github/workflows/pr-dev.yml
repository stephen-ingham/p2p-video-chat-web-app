name: PR checks (dev)

on:
  pull_request:
    branches: [dev]
  workflow_dispatch:

jobs:
  lint:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      # XO type-checks the TypeScript in these workspaces, so it needs their
      # deps (web-server/src's tsconfig also extends astro/tsconfigs/strict)
      # and Astro's generated types (astro:middleware, import.meta.env).
      # mobile-app/ is skipped here, linted by mobile-ci.yml instead.
      - name: Install workspace dependencies for type-aware lint
        run: |
          npm ci --prefix web-server/src
          npm ci --prefix web-server/tests
          npm ci --prefix infra
      - name: Generate Astro types
        run: npx astro sync
        working-directory: web-server/src
      - name: Lint (xo + prettier)
        run: npm run lint

  # The happy paths below (web and mobile, locally and on GCP) run on every
  # PR, whatever files it touches, to catch obvious regressions early.

  # Mobile happy path (Maestro, Android emulator) against a local API:
  # mobile-e2e.yml with only the flows tagged happy-path. PRs into main run
  # every flow from there.
  mobile-e2e-happy-path:
    needs: lint
    uses: ./.github/workflows/mobile-e2e.yml
    with:
      happy_path_only: true

  e2e-happy-path:
    needs: lint
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Create .env from example
        run: cp .env.example .env
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Point voneo.test at localhost
        run: echo "127.0.0.1 voneo.test" | sudo tee -a /etc/hosts
      - name: Run happy-path e2e tests
        run: npm run test:e2e:happy-path
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-happy-path
          path: playwright-report/
          retention-days: 14

  # Web and mobile happy paths against a real GCP deployment of the PR: the
  # ephemeral dev stack (infra/Pulumi.dev.yaml) is deployed, tested and always
  # destroyed, all in this one job so the concurrency lock covers the stack's
  # whole life. Fork PRs get no GCP credentials, so it only runs for this
  # repo's branches.
  e2e-gcp-dev:
    needs: lint
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    # Every run shares the one dev stack, so one at a time. Never cancel a
    # run in progress: that could skip its teardown.
    concurrency:
      group: gcp-dev-stack
      cancel-in-progress: false
    # Up to ~35 min deploy, ~10 min web tests, ~40 min APK build + emulator
    # run, with time left for the teardown.
    timeout-minutes: 120
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write # GCP Workload Identity Federation
    env:
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
    steps:
      # The PR's head commit rather than the merge commit, so the deployment's
      # git-sha label is a commit that exists on GitHub.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install infra dependencies
        run: npm ci
        working-directory: infra
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      # With no command, this only installs the Pulumi CLI.
      - name: Install Pulumi CLI
        uses: pulumi/actions@v6
      - name: Deploy ephemeral dev stack
        timeout-minutes: 35
        run: node scripts/gcp-e2e.mjs up dev
      - name: Run web happy-path e2e against it
        timeout-minutes: 25
        run: node scripts/gcp-e2e.mjs test dev --grep @happy-path
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-gcp-dev
          path: playwright-report/
          retention-days: 14
      # The stack runs with NODE_ENV=production, so the dev seed users the
      # Maestro flows log in as don't exist: sign that one up (through the
      # frontend, which proxies the API), then check it can log in.
      - name: Sign up the user the Maestro flows log in as
        id: mobile_user
        timeout-minutes: 20
        working-directory: infra
        run: |
          APP_URL=$(pulumi stack output appUrl --stack dev)
          echo "app_url=$APP_URL" >> "$GITHUB_OUTPUT"
          until [ "$(curl -s -o /dev/null -w '%{http_code}' "$APP_URL/call/ice-servers")" = "401" ]; do
            echo "Waiting for $APP_URL to serve the API"
            sleep 15
          done
          curl -s -o /dev/null -X POST "$APP_URL/auth/signup" -H 'Content-Type: application/json'             -d '{"username":"john2739","email":"john.smith@gmail.com","password":"ExamplePassword123"}'
          curl -fsS -o /dev/null -X POST "$APP_URL/auth/login" -H 'Content-Type: application/json'             -d '{"email":"john.smith@gmail.com","password":"ExamplePassword123"}'
      - name: Run mobile happy-path e2e against it (Maestro)
        timeout-minutes: 45
        uses: ./.github/actions/maestro-e2e
        with:
          api_url: ${{ steps.mobile_user.outputs.app_url }}
          happy_path_only: "true"
          artifact_name: maestro-results-gcp-dev
      # Runs even if an earlier step failed or the job was cancelled, so a
      # half-created stack doesn't keep billing.
      - name: Destroy ephemeral dev stack
        if: always()
        timeout-minutes: 20
        run: node scripts/gcp-e2e.mjs down dev
