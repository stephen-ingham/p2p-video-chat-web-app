name: Deploy (dev)

# Runs after a PR merges into dev (i.e. a push to dev). Requires:
#   - Workload Identity Federation set up in GCP, with the pool/provider
#     and service account below configured as repo secrets/vars.
#   - A Pulumi state backend + PULUMI_ACCESS_TOKEN (or self-managed backend
#     login) — not yet configured, see infra/Pulumi.dev.yaml TODOs.
# Until those exist this workflow will fail at the auth/login step by
# design, rather than silently no-op.

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for GCP Workload Identity Federation

jobs:
  deploy:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # TODO: create the WIF pool/provider + service account in GCP, then
      # set these as repo/environment secrets or vars.
      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Install infra dependencies
        run: npm ci
        working-directory: infra

      # TODO: set PULUMI_ACCESS_TOKEN as a repo secret once a Pulumi Cloud
      # (or self-managed) backend is chosen. pulumi/actions installs the
      # Pulumi CLI itself and runs `pulumi up` against the given stack.
      - name: Pulumi up (dev stack)
        uses: pulumi/actions@v6
        with:
          command: up
          stack-name: dev
          work-dir: infra
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
