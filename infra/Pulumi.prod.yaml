config:
  # TODO: set the target GCP project for the prod environment:
  #   pulumi config set gcp:project YOUR_PROD_PROJECT_ID --stack prod
  gcp:project: TODO-prod-project-id
  gcp:region: europe-west2
  # Container image tags to deploy — CI overrides these per-run via
  # `pulumi config set --stack prod frontendImageTag <sha>` before `pulumi up`.
  voneo-video-chat:frontendImageTag: latest
  voneo-video-chat:backendImageTag: latest
  # Secrets — set locally once a Pulumi backend/passphrase is configured:
  #   pulumi config set --secret dbPassword <value> --stack prod
  #   pulumi config set --secret jwtSecret <value> --stack prod
  #   pulumi config set --secret refreshTokenSecret <value> --stack prod
