# Base coturn config shared by the production GCE VM (infra/turn-server.ts appends
# its environment-specific lines at boot) and the CI NAT-traversal e2e stack
# (e2e/compose.nat.yaml mounts this file and passes its extras as CLI flags).
# Keep anything that should behave identically in both places in here, so CI
# tests the same server config that production runs.

# Plain STUN/TURN on the standard port, over both UDP and TCP. TLS (turns:)
# needs a certificate for a real domain, which doesn't exist yet.
listening-port=3478
no-tls

# Relay ports. Kept small so the GCP firewall rule stays narrow; each active
# relayed peer connection holds one port, so this caps concurrent relayed
# connections at ~100.
min-port=49152
max-port=49252

# TURN REST API auth: the signalling API mints short-lived credentials from
# this shared secret (web-socket-api/src/call/utils/ice-servers.js). The
# secret itself (static-auth-secret) is supplied per environment.
use-auth-secret
realm=voneo
fingerprint
stale-nonce=600

# Abuse/cost limits. Relayed media is billed as GCP egress, so cap the number
# of allocations, the bandwidth of each (500 KB/s, 4 Mbps: enough for a 720p
# video + audio stream) and the bandwidth of all of them together (5 MB/s).
# bps-capacity is the one that bounds the bill: at most ~18 GB of relayed
# egress an hour, whatever the number of users or allocations.
user-quota=12
total-quota=20
max-bps=500000
bps-capacity=5000000

no-multicast-peers
log-file=stdout
simple-log
