# Fresh launch with camera/mic allowed. Against the dev-client build, pass
# `-e DEV_CLIENT=true`: clearState drops the dev client's last server, so a
# deep link points it straight at Metro (the emulator reaches the host's 8081
# at 10.0.2.2) and skips its launcher and first-run dev menu intro, whose
# timing proved too flaky to tap through. CI's build has the JS bundled in and
# no dev client, so it skips that step.
appId: com.voneo.app
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- runFlow:
    when:
      true: ${DEV_CLIENT == 'true'}
    commands:
      - openLink: "exp+voneo://expo-development-client/?url=http%3A%2F%2F10.0.2.2%3A8081&disableOnboarding=1"
# Busy emulators (freshly booted, or CI's) can show a system "<app> isn't
# responding" dialog over the app; waiting it out is harmless.
- runFlow:
    when:
      visible: ".*isn't responding"
    commands:
      - tapOn: "Wait"
# Generous, since a dev-client launch bundles the JS on first load.
- extendedWaitUntil:
    visible:
      id: "email-input"
    timeout: 120000
