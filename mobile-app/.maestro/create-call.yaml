# Log in as the seeded dev user, create a call, check it's joined, hang up.
# Needs the app's dev-client build installed, and the LOCAL=true dev stack
# (NODE_ENV=dev, so the seeded users exist) reachable at 10.0.2.2:3000.
appId: com.voneo.app
# The mobile happy path: the only flow mobile-e2e.yml runs on PRs into dev.
tags:
  - happy-path
---
- runFlow: subflows/launch.yaml
# Each tap opens or moves the keyboard, which shifts the form on a small
# screen: let it settle before typing, or the text can land in the wrong
# field. Then close it, as it covers the submit button.
- runFlow: subflows/type-email.yaml
- tapOn:
    id: "password-input"
- waitForAnimationToEnd:
    timeout: 3000
- inputText: "ExamplePassword123"
- hideKeyboard
- tapOn:
    id: "auth-submit"
- extendedWaitUntil:
    visible:
      id: "create-call-button"
    timeout: 15000
- tapOn:
    id: "create-call-button"
- extendedWaitUntil:
    visible:
      id: "call-id"
    timeout: 20000
- assertVisible:
    id: "local-video"
- assertVisible: "Waiting for others to join…"
- tapOn:
    id: "hang-up-button"
- extendedWaitUntil:
    visible:
      id: "create-call-button"
    timeout: 10000
