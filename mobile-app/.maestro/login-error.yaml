# A wrong password shows an error and stays on the login screen.
# Same requirements as create-call.yaml.
appId: com.voneo.app
---
- runFlow: subflows/launch.yaml
# Let the keyboard settle before typing, then close it: see create-call.yaml.
- runFlow: subflows/type-email.yaml
- tapOn:
    id: "password-input"
- waitForAnimationToEnd:
    timeout: 3000
- inputText: "not-the-password"
- hideKeyboard
- tapOn:
    id: "auth-submit"
- extendedWaitUntil:
    visible:
      id: "auth-error"
    timeout: 15000
- assertVisible: "Login failed. Check your email and password."
- assertNotVisible:
    id: "create-call-button"
